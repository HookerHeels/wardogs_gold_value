# Stamps "updated" in values.json with the current UTC time whenever values.json is changed.
name: Stamp updated time

on:
  push:
    paths: ["values.json"]

permissions:
  contents: write

jobs:
  stamp:
    # skip the bot's own commit so this can't loop
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write current UTC time into values.json
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 - "$NOW" <<'PY'
          import json, sys
          p = "values.json"
          d = json.load(open(p))
          d["updated"] = sys.argv[1]
          out = {k: d[k] for k in ("current", "previous", "updated", "history")}
          open(p, "w").write(json.dumps(out, indent=2) + "\n")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add values.json
          git diff --cached --quiet || (git commit -m "Stamp updated time [skip ci]" && git push)
